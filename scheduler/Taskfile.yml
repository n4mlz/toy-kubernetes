version: '3'

tasks:
  build:
    silent: true
    cmds:
      - mkdir -p .toy/bin
      - go build -o .toy/bin/kube-scheduler ./cmd/scheduler

  test:
    silent: true
    cmds:
      - go test ./scheduler

  check:
    silent: true
    cmds:
      - task: check:tools

  check:tools:
    silent: true
    cmds:
      - "command -v go >/dev/null 2>&1 && echo '[scheduler] Go ok' || { echo '[scheduler] Go failed'; exit 1; }"
