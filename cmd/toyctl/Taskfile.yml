version: '3'

tasks:
  build:
    silent: true
    cmds:
      - mkdir -p .toy/bin
      - go build -o .toy/bin/toyctl ./cmd/toyctl

  test:
    silent: true
    cmds:
      - go test ./cmd/toyctl ./bootstrap

  check:
    silent: true
    cmds:
      - "command -v go >/dev/null 2>&1 && echo '[toyctl] Go ok' || { echo '[toyctl] Go failed'; exit 1; }"
