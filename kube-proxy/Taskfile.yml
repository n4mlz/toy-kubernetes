version: '3'

tasks:
  build:
    silent: true
    cmds:
      - mkdir -p .toy/bin
      - go build -o .toy/bin/kube-proxy ./cmd/kube-proxy

  test:
    silent: true
    cmds:
      - go test ./kube-proxy

  check:
    silent: true
    cmds:
      - task: check:tools
      - task: check:forwarding

  check:tools:
    silent: true
    cmds:
      - "command -v go >/dev/null 2>&1 && echo '[kube-proxy] Go ok' || { echo '[kube-proxy] Go failed'; exit 1; }"
      - "command -v ip >/dev/null 2>&1 && echo '[kube-proxy] iproute2 ok' || { echo '[kube-proxy] iproute2 failed'; exit 1; }"
  check:forwarding:
    silent: true
    cmds:
      - |
        if command -v nft >/dev/null 2>&1; then
          unshare --user --map-root-user --net --fork sh -c '
            set -eu
            nft add table ip check
            nft delete table ip check
          ' >/dev/null 2>&1 && printf '%s\n' '[kube-proxy] nftables ok' || { printf '%s\n' '[kube-proxy] nftables failed'; exit 1; }
        elif command -v iptables >/dev/null 2>&1; then
          echo '[kube-proxy] iptables available (isolated check skipped)'
        else
          echo '[kube-proxy] nftables/iptables failed'
          exit 1
        fi
