version: '3'

tasks:
  build:
    silent: true
    cmds:
      - mkdir -p .toy/bin
      - go build -o .toy/bin/kube-apiserver ./cmd/apiserver

  test:
    silent: true
    cmds:
      - go test ./apiserver

  check:
    silent: true
    cmds:
      - task: check:tools
      - task: check:socket

  check:tools:
    silent: true
    cmds:
      - "command -v go >/dev/null 2>&1 && echo '[apiserver] Go ok' || { echo '[apiserver] Go failed'; exit 1; }"
      - "command -v curl >/dev/null 2>&1 && echo '[apiserver] curl ok' || { echo '[apiserver] curl failed'; exit 1; }"

  check:socket:
    silent: true
    cmds:
      - |
        socket_path=$(mktemp)
        test -e "$socket_path" && echo '[apiserver] temporary path ok' || { echo '[apiserver] temporary path failed'; exit 1; }
        rm -f "$socket_path"
