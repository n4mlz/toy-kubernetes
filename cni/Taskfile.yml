version: '3'

tasks:
  build:
    silent: true
    cmds:
      - go test -run '^$' ./cni

  test:
    silent: true
    cmds:
      - go test ./cni

  test-network:
    silent: true
    cmds:
      - mkdir -p .toy/bin
      - go build -o .toy/bin/runtime ./cmd/runtime
      - sh ./cni/scripts/test-network.sh

  check:
    silent: true
    cmds:
      - task: check:tools
      - task: check:network-namespace
      - task: check:bridge-veth

  check:tools:
    silent: true
    cmds:
      - "command -v ip >/dev/null 2>&1 && echo '[cni] iproute2 ok' || { echo '[cni] iproute2 failed'; exit 1; }"
      - "command -v unshare >/dev/null 2>&1 && echo '[cni] unshare ok' || { echo '[cni] unshare failed'; exit 1; }"

  check:network-namespace:
    silent: true
    cmds:
      - "unshare --user --map-root-user --net --fork true >/dev/null 2>&1 && echo '[cni] network namespace ok' || { echo '[cni] network namespace failed'; exit 1; }"

  check:bridge-veth:
    silent: true
    cmds:
      - |
        unshare --user --map-root-user --net --fork sh -c '
          set -eu
          ip link add check-br type bridge
          ip link add check-a type veth peer name check-b
          ip link set check-a master check-br
          ip link del check-b
          ip link del check-br
        ' >/dev/null 2>&1 && printf '%s\n' '[cni] bridge/veth ok' || { printf '%s\n' '[cni] bridge/veth failed'; exit 1; }
